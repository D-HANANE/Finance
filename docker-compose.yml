
name: finance-market

x-app: &app
  build: .
  image: finance-market-python:local
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: trades
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:?Copier .env.example vers .env}
    AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?Configurer .env}
    AWS_DEFAULT_REGION: us-east-1
    BRONZE_BUCKET: bronze

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped
  
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  minio:
    image: docker.io/pgsty/silo:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:?Configurer .env}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Configurer .env}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  init:
    <<: *app
    command: ["python", "init_services.py"]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  producer:
    <<: *app
    command: ["python", "producer.py"]
    environment:
      <<: *app-env
      TRADES_PER_SECOND: ${TRADES_PER_SECOND:-220}
      SHOCK_AFTER_SECONDS: ${SHOCK_AFTER_SECONDS:-360}
      SHOCK_EVERY_SECONDS: ${SHOCK_EVERY_SECONDS:-300}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  consumer-bronze:
    <<: *app
    command: ["python", "consumer_bronze.py"]
    environment:
      <<: *app-env
      KAFKA_GROUP_ID: bronze-trades-writer
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      BATCH_SECONDS: ${BATCH_SECONDS:-30}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 60s

volumes:
  kafka_data:
  minio_data:
