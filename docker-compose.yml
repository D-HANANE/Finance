name: finance-market

x-app: &app
  build: .
  image: finance-market-python:local
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: trades
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:?Copier .env.example vers .env}
    AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?Configurer .env}
    AWS_DEFAULT_REGION: us-east-1
    BRONZE_BUCKET: bronze
    PG_DSN: postgresql://finance:${POSTGRES_PASSWORD:-local_demo_change_me}@postgres:5432/finance

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    mem_limit: 768m

  minio:
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:?Configurer .env}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?Configurer .env}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    mem_limit: 512m

  init:
    <<: *app
    command: ["python", "init_services.py"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  producer:
    <<: *app
    command: ["python", "producer.py"]
    environment:
      <<: *app-env
      TRADES_PER_SECOND: ${TRADES_PER_SECOND:-220}
      SHOCK_AFTER_SECONDS: ${SHOCK_AFTER_SECONDS:-360}
      SHOCK_EVERY_SECONDS: ${SHOCK_EVERY_SECONDS:-300}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    mem_limit: 128m

  consumer-bronze:
    <<: *app
    command: ["python", "consumer_bronze.py"]
    environment:
      <<: *app-env
      KAFKA_GROUP_ID: bronze-trades-writer
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      BATCH_SECONDS: ${BATCH_SECONDS:-30}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 60s
    mem_limit: 256m

  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: finance-market-spark:local
    environment:
      <<: *app-env
      TZ: UTC
      SPARK_MAX_OFFSETS: ${SPARK_MAX_OFFSETS:-50000}
    volumes:
      - spark_state:/state
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    mem_limit: 2560m
    restart: on-failure
    stop_grace_period: 30s

  lakehouse:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: finance-market-spark:local
    entrypoint: ["/opt/spark/bin/spark-submit","--master","local[2]","--driver-memory","1280m","--conf","spark.sql.shuffle.partitions=4","--conf","spark.driver.extraJavaOptions=-Duser.timezone=UTC","/opt/finance/runner.py"]
    environment:
      <<: *app-env
      TZ: UTC
      BRONZE_FILES_PER_RUN: ${BRONZE_FILES_PER_RUN:-200}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 4
    mem_limit: 2560m
    restart: on-failure
    stop_grace_period: 30s

  dagster:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    environment:
      <<: *app-env
      LAKEHOUSE_URL: http://lakehouse:8090
      STREAMING_URL: http://spark:8091
    volumes:
      - dagster_data:/dagster
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    mem_limit: 1g
    restart: on-failure

  grafana:
    image: grafana/grafana-oss:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local_demo_change_me}
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      <<: *app-env
      LAKEHOUSE_URL: http://lakehouse:8090
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: on-failure

volumes:
  kafka_data:
  minio_data:
  postgres_data:
  spark_state:
  dagster_data:
  grafana_data:
