name: finance-v2-ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyyaml==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_config.py
      - run: cp .env.example .env
      - run: docker compose config --quiet
  spark_sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: pip install -r requirements.txt pyspark==3.5.5
      - run: spark-submit --master local[2] scripts/test_spark.py
      - run: spark-submit --master local[2] scripts/test_gold_spark.py

  all_symbols_integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres
      - run: docker compose build lakehouse
      - run: docker compose run --rm --no-deps -v "${{ github.workspace }}:/checks:ro" -v "${{ github.workspace }}/postgres:/schema:ro" --entrypoint /opt/spark/bin/spark-submit lakehouse --master local[1] --driver-memory 512m /checks/scripts/test_all_symbols_gold.py
      - if: always()
        run: docker compose down
